<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171025">
  <meta name="description" content="Bring your best brain-teasers. Contribute 2–5 questions, answers and optional photos for our Halloween quiz.">
  <title>Spooky Quiz — Your questions wanted</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://tally.so">
</head>
<body>
  <a class="skip-link" href="#contribute">Skip to the question form</a>
  <main>
    <section class="invitation" aria-labelledby="page-title">
      <div class="artwork"><span class="wordmark">Spooky<br>Quiz</span></div>
      <div class="invitation-copy">
        <h1 id="page-title">Add a question</h1>
      </div>
    </section>
    <section class="form-section" id="contribute" aria-label="Contribute your quiz questions" tabindex="-1">
      <iframe
        data-tally-src="https://tally.so/embed/KpzeqK?alignLeft=1&hideTitle=1&dynamicHeight=1"
        title="Spooky Quiz question submission form"
        width="100%"
        height="1200"
        scrolling="no"
        frameborder="0"
        marginheight="0"
        marginwidth="0"></iframe>
      <p class="form-fallback"><a href="https://tally.so/r/KpzeqK" target="_blank" rel="noopener noreferrer">Open form separately ↗</a></p>
    </section>
  </main>
  <script src="https://tally.so/widgets/embed.js" async></script>
</body>
</html>
